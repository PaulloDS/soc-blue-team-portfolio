services:
  es:
    image: docker.elastic.co/elasticsearch/elasticsearch:${STACK_VERSION:-8.15.3}
    environment:
      - discovery.type=single-node
      - ELASTIC_PASSWORD=${ELASTIC_PASSWORD}
      - xpack.security.enabled=true
      - xpack.security.http.ssl.enabled=false
      - xpack.license.self_generated.type=basic
      - ES_JAVA_OPTS=-Xms1g -Xmx1g
    ports: ["9200:9200"]
    volumes: ["esdata:/usr/share/elasticsearch/data"]
    healthcheck:
      test: ["CMD-SHELL", "curl -s -u elastic:${ELASTIC_PASSWORD} http://localhost:9200/_cluster/health | grep -qE '\"status\":\"(green|yellow)\"'"]
      interval: 10s
      timeout: 5s
      retries: 30

  setup:   # define a senha do usuário kibana_system e encerra
    image: docker.elastic.co/elasticsearch/elasticsearch:${STACK_VERSION:-8.15.3}
    depends_on:
      es: {condition: service_healthy}
    restart: "no"
    command: >
      bash -c 'curl -sf -X POST -u "elastic:${ELASTIC_PASSWORD}" -H "Content-Type: application/json"
      http://es:9200/_security/user/kibana_system/_password
      -d "{\"password\":\"${ELASTIC_PASSWORD}\"}" && echo senha-kibana-ok'

  kibana:
    image: docker.elastic.co/kibana/kibana:${STACK_VERSION:-8.15.3}
    depends_on:
      setup: {condition: service_completed_successfully}
    environment:
      - ELASTICSEARCH_HOSTS=http://es:9200
      - ELASTICSEARCH_USERNAME=kibana_system
      - ELASTICSEARCH_PASSWORD=${ELASTIC_PASSWORD}
      - XPACK_SECURITY_ENCRYPTIONKEY=lab-only-security-key-0123456789abcdef
      - XPACK_ENCRYPTEDSAVEDOBJECTS_ENCRYPTIONKEY=lab-only-saved-objs-0123456789abcdef
      - XPACK_REPORTING_ENCRYPTIONKEY=lab-only-reporting-0123456789abcdef
    ports: ["5601:5601"]

  # Alvo SSH de ataque de verdade. Só sobe sob demanda (profile "attack"),
  # nunca com "./lab.sh up" normal.
  attack-target:
    build: ./attack-target
    profiles: ["attack"]
    ports: ["2222:22"]

volumes:
  esdata:
